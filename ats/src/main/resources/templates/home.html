<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Панель АТС</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        .ats-container {
            width: 700px;
            border: 1px solid #000;
            padding: 20px;
            margin: 25px auto;
            box-sizing: border-box;
            background-color: #fff;
        }

        .top-section {
            display: flex;
            align-items: flex-start;

            /* Кнопки больше не прижимаются вправо */
            justify-content: flex-start;

            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .input-group input[type="text"] {
            width: 190px;
            height: 34px;

            padding: 4px 8px;

            border: 1px solid #777;
            box-sizing: border-box;

            font-size: 16px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 130px;
            height: 34px;

            padding: 4px 12px;

            border: 1px solid #777;
            border-radius: 4px;

            background-color: #b7b7b7;

            font-size: 15px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #9d9d9d;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .history-label {
            margin-bottom: 6px;
            font-size: 16px;
        }

        .history-table-wrapper {
            position: relative;

            height: 380px;
            overflow-y: auto;

            border: 1px solid #777;
            background-color: #cfe2f3;
        }

        /*
         * Постоянная вертикальная линия между колонками.
         * Поэтому она есть даже при полностью пустой истории.
         */
        .history-table-wrapper::after {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;
            left: 25%;

            border-left: 1px solid #777;

            pointer-events: none;
        }

        .history-table {
            width: 100%;

            border-collapse: collapse;
            table-layout: fixed;

            background: transparent;
        }

        .history-table th,
        .history-table td {
            padding: 7px 10px;

            text-align: left;
            vertical-align: top;

            font-size: 15px;
            font-weight: normal;

            background-color: #cfe2f3;
        }

        .history-table th:first-child,
        .history-table td:first-child {
            width: 25%;
        }

        /*
         * Только у заголовка есть нижняя линия.
         */
        .history-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;

            border-bottom: 1px solid #777;

            background-color: #cfe2f3;
        }

        /*
         * Строки событий отделяем линиями.
         */
        .history-table tbody tr:not(:last-child) td {
            border-bottom: 1px solid #777;
        }

        /*
         * Если по какой-то причине JS создал
         * полностью пустую строку — не показываем её.
         */
        .history-table tbody tr:empty {
            display: none;
        }

        .event-data-line {
            margin-bottom: 4px;
        }

        .event-data-line:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

<div class="ats-container">

    <div class="top-section">

        <div class="input-group">

            <label for="phoneNumber">
                Введите номер телефона:
            </label>

            <input
                type="text"
                id="phoneNumber"
                value="+7-___-___-__-__"
                maxlength="16"
                autocomplete="off"
                inputmode="numeric"
            >

        </div>

        <div class="button-group">

            <button
                type="button"
                id="callButton"
                class="btn"
            >
                Позвонить
            </button>

            <button
                type="button"
                id="cancelButton"
                class="btn"
            >
                Отменить
            </button>

        </div>

    </div>


    <div class="history-section">

        <div class="history-label">
            История событий:
        </div>

        <div class="history-table-wrapper">

            <table class="history-table">

                <thead>
                <tr>
                    <th>Событие:</th>
                    <th>Данные:</th>
                </tr>
                </thead>

                <tbody id="eventHistory"></tbody>

            </table>

        </div>

    </div>

</div>


<script th:inline="javascript">
    window.APP_CONFIG = {
        telephonyUrl: /*[[${telephonyUrl}]]*/
    };
</script>

<script src="/js/ats.js"></script>

</body>

</html>
